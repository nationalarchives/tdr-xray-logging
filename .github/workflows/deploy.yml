name: TDR Deploy X-ray Logging
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
        default: 'intg'
      to-deploy:
        description: 'Version to deploy'
        required: true

run-name: Deploying Transfer Frontend ${{inputs.to-deploy}} to ${{inputs.environment}}

permissions:
  id-token: write
  contents: write
jobs:
  deploy-frontend:
    uses: nationalarchives/tdr-github-actions/.github/workflows/ecs_deploy.yml@f4d7086babd2c5156dd483d445e4500a603d8dc4 # v0.0.42
    with:
      service: frontend
      image-name: aws-otel-collector
      environment: ${{ github.event.inputs.environment }}
      to-deploy: ${{ github.event.inputs.to-deploy }}
    secrets:
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
